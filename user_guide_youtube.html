<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Overlord Bot Guide</title>

    <!-- Telegram WebApp JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f8f9fa);
            --text-color: var(--tg-theme-text-color, #333333);
            --hint-color: var(--tg-theme-hint-color, #666666);
            --btn-color: var(--tg-theme-button-color, #2481cc);
            --btn-text-color: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            min-height: 100vh;
            padding-top: calc(15px + env(safe-area-inset-top));
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }

        .header-text {
            text-align: center;
            margin-bottom: 15px;
            transition: opacity 0.3s ease;
        }

        .header-text h2 {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
        }

        .header-text p {
            color: var(--hint-color);
            font-size: 0.85rem;
            margin: 0;
            line-height: 1.4;
        }

        .video-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            margin: 0 auto; 
            width: 100%; 
            max-width: 800px; 
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9; 
            border: none;
        }

        /* Pure CSS Fullscreen Mode (iOS / Android နှစ်ခုလုံးအတွက်) */
        .video-container.custom-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            z-index: 999999 !important;
            border-radius: 0 !important;
            margin: 0 !important;
        }

        .video-container.custom-fullscreen iframe {
            height: 100vh !important;
            aspect-ratio: auto !important;
        }

        /* Landscape Mode အတွက် CSS Optimization */
        @media screen and (orientation: landscape) {
            body {
                padding: 0;
                background-color: #000;
            }
            .header-text, .controls-bar {
                display: none !important; /* လှည့်လိုက်ပါက စာနှင့် Button များကို ဖျောက်၍ ဗီဒီယိုကို တစ်ပြင်လုံးပြမည် */
            }
            .video-container {
                max-width: 100vw;
                height: 100vh;
                border-radius: 0;
            }
            .video-container iframe {
                height: 100vh;
            }
        }

        .controls-bar {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .btn-fullscreen {
            background-color: var(--btn-color);
            color: var(--btn-text-color);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-fullscreen:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="header-text" id="headerText">
        <h2>Overlord Bot အသုံးပြုနည်း လမ်းညွှန်</h2>
        <p>Bot ကို စတင်အသုံးပြုပုံနှင့် Signal များဖတ်နည်း လမ်းညွှန် ဗီဒီယိုများ</p>
    </div>

    <div class="video-container" id="videoBox">
        <iframe 
            id="ytPlayer"
            src="https://www.youtube.com/embed/videoseries?list=PLATyixI4j2D8&enablejsapi=1" 
            title="Overlord Bot Guide" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
    </div>

    <div class="controls-bar" id="controlsBar">
        <button class="btn-fullscreen" onclick="toggleManualFullscreen()">
            <span id="btnIcon">⛶</span> <span id="btnText">မျက်နှာပြင် အပြည့်ကြည့်မည် (Zoom)</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const videoBox = document.getElementById('videoBox');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        // Toggle Fullscreen System (CSS-based + Native Fallback)
        function toggleManualFullscreen() {
            // Telegram Haptic Feedback
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            const isFullscreen = videoBox.classList.contains('custom-fullscreen');

            if (!isFullscreen) {
                // Open Fullscreen
                videoBox.classList.add('custom-fullscreen');
                btnText.textContent = "ပုံမှန်အတိုင်း ပြန်ထားမည်";
                btnIcon.textContent = "✕";

                // Native API ကူညီနိုင်ပါက ခေါ်မည် (Android အတွက်)
                if (videoBox.requestFullscreen) {
                    videoBox.requestFullscreen().catch(() => {});
                }
            } else {
                // Exit Fullscreen
                videoBox.classList.remove('custom-fullscreen');
                btnText.textContent = "မျက်နှာပြင် အပြည့်ကြည့်မည် (Zoom)";
                btnIcon.textContent = "⛶";

                if (document.exitFullscreen && document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                }
            }
        }

        // ESC / Native Back Button နှိပ်ပါက Fullscreen ပြန်ထွက်ရန်
        document.addEventListener("fullscreenchange", () => {
            if (!document.fullscreenElement) {
                videoBox.classList.remove('custom-fullscreen');
                btnText.textContent = "မျက်နှာပြင် အပြည့်ကြည့်မည် (Zoom)";
                btnIcon.textContent = "⛶";
            }
        });
    </script>
</body>
</html>
