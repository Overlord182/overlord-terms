<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Overlord Bot Guide & Dynamic Learning Hub</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        :root {
            --primary-color: #ff0000;
            --bg-color: var(--tg-theme-bg-color, #0f0f0f);
            --card-bg: #1f1f1f;
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --btn-color: var(--tg-theme-button-color, #2481cc);
            --btn-text-color: var(--tg-theme-button-text-color, #ffffff);
        }

        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .video-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            margin: 0 auto; 
            width: 100%; 
            max-width: 800px; 
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            touch-action: none;
        }

        /* Video ပေါ်တွင် Download ဆွဲခြင်းနှင့် ညာဘက်က্লিকခြင်း တားဆီးရန် Transparent Overlay */
        .video-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            background: transparent;
            pointer-events: none; /* Controls များကို နှိပ်လို့ရစေရန် */
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: auto;
        }

        .header-text, .controls-bar, .whiteboard-card, .search-box-container, .learning-hub-section, .playlist-section {
            width: 100%;
            max-width: 800px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header-text">
        <h2>Overlord Bot & Trading Learning Hub</h2>
        <p>လုံခြုံရေးစနစ် မြှင့်တင်ထားသော သင်ခန်းစာများ</p>
    </div>

    <!-- Video Player Container -->
    <div class="video-container" id="videoBox">
        <div class="video-shield"></div>
        <iframe 
            id="ytPlayer"
            src="https://www.youtube.com/embed/videoseries?list=PLATyixI4j2D8&enablejsapi=1&controls=1&modestbranding=1&rel=0&playsinline=1" 
            title="Overlord Bot Guide" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ညာဘက်က্লিক၊ ကူးယူမှုနှင့် Inspect ပြုလုပ်ခြင်းကို တားဆီးခြင်း
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('copy', (e) => e.preventDefault());
        document.addEventListener('cut', (e) => e.preventDefault());
        document.addEventListener('paste', (e) => e.preventDefault());
        document.addEventListener('dragstart', (e) => e.preventDefault());

        document.addEventListener('keydown', (e) => {
            if (
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
            ) {
                e.preventDefault();
                alert('လုံခြုံရေးအရ ဤလုပ်ဆောင်ချက်ကို ပိတ်ပင်ထားပါသည်။');
            }
        });

        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytPlayer', {
                events: {
                    'onReady': () => {}
                }
            });
        }
    </script>
</body>
</html>
