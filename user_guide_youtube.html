<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Overlord Bot Guide</title>

    <!-- Telegram WebApp JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f8f9fa);
            color: var(--tg-theme-text-color, #333333);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .header-text {
            text-align: center;
            margin-bottom: 15px;
        }

        .header-text h2 {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
        }

        .header-text p {
            color: var(--tg-theme-hint-color, #666666);
            font-size: 0.85rem;
            margin: 0;
            line-height: 1.4;
        }

        .video-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            margin: 0 auto; 
            width: 100%; 
            max-width: 800px; 
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); 
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9; 
            border: none;
        }

        /* Landscape Mode အတွက် CSS Optimization */
        @media screen and (orientation: landscape) {
            body {
                padding: 0;
                background-color: #000;
            }
            .header-text {
                display: none; /* စာသားများကို ခဏဖျောက်၍ ဗီဒီယိုကို ပိုကျယ်စေခြင်း */
            }
            .video-container {
                max-width: 100vw;
                height: 100vh;
                border-radius: 0;
            }
            .video-container iframe {
                height: 100vh;
            }
        }

        /* Custom Zoom/Fullscreen Button */
        .controls-bar {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .btn-fullscreen {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="header-text">
        <h2>Overlord Bot အသုံးပြုနည်း လမ်းညွှန်</h2>
        <p>Bot ကို စတင်အသုံးပြုပုံနှင့် Signal များဖတ်နည်း လမ်းညွှန် ဗီဒီယိုများ</p>
    </div>

    <!-- ဗီဒီယိုနှင့် Fullscreen ချိန်ညှိမည့် အခွံ -->
    <div class="video-container" id="videoBox">
        <iframe 
            id="ytPlayer"
            src="https://www.youtube.com/embed/videoseries?list=PLATyixI4j2D8&enablejsapi=1" 
            title="Overlord Bot Guide" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" 
            allowfullscreen>
        </iframe>
    </div>

    <!-- Manual Fullscreen/Zoom ခလုတ် -->
    <div class="controls-bar">
        <button class="btn-fullscreen" onclick="toggleManualFullscreen()"> မျက်နှာပြင် အပြည့်ကြည့်မည် (Zoom)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const videoBox = document.getElementById('videoBox');

        // ၁။ ဖုန်းလှဲ့လိုက်ပါက (Rotate) Auto Fullscreen ပြုလုပ်ပေးသည့် Logic
        function handleAutoOrientation() {
            if (window.innerWidth > window.innerHeight) {
                // Landscape (လှဲ့လိုက်လျှင်) Fullscreen ခေါ်မည်
                if (videoBox.requestFullscreen) {
                    videoBox.requestFullscreen().catch(() => {});
                } else if (videoBox.webkitRequestFullscreen) { /* iOS Safari */
                    videoBox.webkitRequestFullscreen();
                }
            } else {
                // Portrait (မတ်တပ်ပြန်ထောင်လျှင်) Fullscreen ပိတ်မည်
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    if (document.exitFullscreen) {
                        document.exitFullscreen().catch(() => {});
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                }
            }
        }

        // Screen Resize / Orientation ပြောင်းလဲမှုကို စောင့်ကြည့်ခြင်း
        window.addEventListener("resize", handleAutoOrientation);
        window.addEventListener("orientationchange", handleAutoOrientation);

        // ၂။ Manual Fullscreen Toggle Button နှိပ်ပါက လုပ်ဆောင်မည့် Logic
        function toggleManualFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (videoBox.requestFullscreen) {
                    videoBox.requestFullscreen();
                } else if (videoBox.webkitRequestFullscreen) {
                    videoBox.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
