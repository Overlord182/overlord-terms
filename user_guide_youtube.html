<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Overlord YouTube Player Hub</title>

    <!-- Telegram WebApp JS SDK & YouTube API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        :root {
            --yt-red: #ff0000;
            --yt-dark: #0f0f0f;
            --yt-card: #1f1f1f;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: "Roboto", "Segoe UI", Arial, sans-serif;
            background-color: var(--yt-dark);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* YouTube Player Exact Container */
        .yt-player-wrapper {
            position: relative;
            width: 100%;
            max-width: 850px;
            aspect-ratio: 16 / 9;
            background: #000000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(0,0,0,0.7);
        }

        .yt-player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
        }

        /* Full Interactive Controls Overlay */
        .yt-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            opacity: 1;
            transition: opacity 0.25s ease;
            z-index: 10;
        }

        .yt-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Top Header Overlay */
        .yt-top-bar {
            padding: 12px 16px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .yt-video-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%;
        }

        /* Center Big Play Icon */
        .yt-center-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60px; height: 60px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            color: #fff;
            font-size: 1.6rem;
            transition: transform 0.15s ease, background 0.2s;
        }

        .yt-center-btn:hover {
            background: rgba(255, 0, 0, 0.8);
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* Ripple Animations for Double Tap (+10s/-10s) */
        .ripple-indicator {
            position: absolute;
            top: 0; bottom: 0;
            width: 40%;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .ripple-indicator.left { left: 0; border-radius: 0 100% 100% 0 / 0 50% 50% 0; }
        .ripple-indicator.right { right: 0; border-radius: 100% 0 0 100% / 50% 0 0 50%; }
        .ripple-indicator.show { opacity: 1; }

        /* Bottom Controls Bar (YouTube Exact Layout) */
        .yt-bottom-bar {
            background: linear-gradient(to top, rgba(0,0,0,0.9) 10%, transparent);
            padding: 0 12px 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* YouTube Interactive Progress Bar */
        .yt-progress-container {
            position: relative;
            width: 100%;
            height: 14px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .yt-progress-bg {
            position: relative;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.3);
            transition: height 0.1s ease;
        }

        .yt-progress-container:hover .yt-progress-bg {
            height: 5px;
        }

        .yt-progress-fill {
            height: 100%;
            background: var(--yt-red);
            width: 0%;
            position: relative;
        }

        .yt-progress-scrubber {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 12px;
            height: 12px;
            background: var(--yt-red);
            border-radius: 50%;
            transition: transform 0.1s ease;
        }

        .yt-progress-container:hover .yt-progress-scrubber {
            transform: translateY(-50%) scale(1);
        }

        .yt-range-input {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 5;
            margin: 0;
        }

        /* Control Buttons Group */
        .yt-controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .yt-left-controls, .yt-right-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .yt-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.9;
            transition: opacity 0.15s, transform 0.1s;
        }

        .yt-btn:hover {
            opacity: 1;
            transform: scale(1.08);
        }

        .yt-time {
            font-size: 0.78rem;
            color: #ddd;
            font-family: Roboto, Arial, sans-serif;
            margin-left: 4px;
        }

        /* Volume Slider Integration */
        .volume-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .volume-slider {
            width: 0px;
            height: 3px;
            appearance: none;
            -webkit-appearance: none;
            background: #fff;
            outline: none;
            transition: width 0.2s ease;
            cursor: pointer;
        }

        .volume-group:hover .volume-slider {
            width: 50px;
        }

        /* Settings Popover Menu */
        .settings-menu {
            position: absolute;
            bottom: 45px;
            right: 12px;
            background: rgba(28, 28, 28, 0.95);
            border-radius: 8px;
            padding: 8px 0;
            width: 180px;
            display: none;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 20;
            font-size: 0.82rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .settings-menu.show { display: flex; }

        .menu-item {
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            color: #eee;
        }

        .menu-item:hover { background: rgba(255,255,255,0.1); }

        /* Search & Playlist Layout */
        .content-section {
            width: 100%;
            max-width: 850px;
            margin-top: 15px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .search-box input {
            flex: 1;
            background: var(--yt-card);
            border: 1px solid #333;
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            outline: none;
        }

        .search-box button {
            background: #333;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .playlist-card {
            display: flex;
            gap: 12px;
            background: var(--yt-card);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .playlist-card.active {
            border-left: 3px solid var(--yt-red);
            background: #2a2a2a;
        }

        .playlist-card img {
            width: 100px;
            aspect-ratio: 16/9;
            border-radius: 4px;
            object-fit: cover;
        }

        .playlist-card h4 {
            margin: 0 0 4px 0;
            font-size: 0.85rem;
            color: #fff;
        }

        .playlist-card p {
            margin: 0;
            font-size: 0.75rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- YouTube Exact Player Container -->
    <div class="yt-player-wrapper" id="ytPlayerWrapper">
        <iframe id="ytPlayer" src="https://www.youtube.com/embed/M7lc1UVf-VE?enablejsapi=1&controls=0&rel=0&modestbranding=1&disablekb=1&playsinline=1"></iframe>

        <!-- YouTube Player Controls Overlay -->
        <div class="yt-overlay" id="ytOverlay">
            <div class="yt-top-bar">
                <div class="yt-video-title" id="videoTitle">Overlord Bot - Trading Course</div>
            </div>

            <button class="yt-center-btn" id="centerPlayBtn" onclick="togglePlay()">▶</button>

            <!-- Touch Ripple Seeking Display -->
            <div class="ripple-indicator left" id="rippleLeft">
                <div>⏪</div>
                <div>10 Seconds</div>
            </div>
            <div class="ripple-indicator right" id="rippleRight">
                <div>⏩</div>
                <div>10 Seconds</div>
            </div>

            <!-- Settings Menu Popup -->
            <div class="settings-menu" id="settingsMenu">
                <div class="menu-item" onclick="setSpeed(0.5)"><span>Speed</span> <span>0.5x</span></div>
                <div class="menu-item" onclick="setSpeed(1)"><span>Speed</span> <span>1.0x (Normal)</span></div>
                <div class="menu-item" onclick="setSpeed(1.5)"><span>Speed</span> <span>1.5x</span></div>
                <div class="menu-item" onclick="setSpeed(2)"><span>Speed</span> <span>2.0x</span></div>
                <hr style="border: 0.5px solid rgba(255,255,255,0.1); width: 100%; margin: 2px 0;">
                <div class="menu-item" onclick="setQuality('hd1080')"><span>Quality</span> <span>1080p</span></div>
                <div class="menu-item" onclick="setQuality('hd720')"><span>Quality</span> <span>720p</span></div>
                <div class="menu-item" onclick="setQuality('medium')"><span>Quality</span> <span>360p</span></div>
            </div>

            <!-- Bottom YouTube Control Bar -->
            <div class="yt-bottom-bar">
                <div class="yt-progress-container">
                    <div class="yt-progress-bg">
                        <div class="yt-progress-fill" id="progressFill">
                            <div class="yt-progress-scrubber"></div>
                        </div>
                    </div>
                    <input type="range" class="yt-range-input" id="progressInput" min="0" max="100" value="0" step="0.1">
                </div>

                <div class="yt-controls-row">
                    <div class="yt-left-controls">
                        <button class="yt-btn" id="playBtn" onclick="togglePlay()">▶</button>
                        <button class="yt-btn" onclick="nextVideo()">⏭</button>
                        <div class="volume-group">
                            <button class="yt-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
                            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
                        </div>
                        <span class="yt-time" id="timeLabel">00:00 / 00:00</span>
                    </div>

                    <div class="yt-right-controls">
                        <button class="yt-btn" onclick="toggleCC()">💬</button>
                        <button class="yt-btn" onclick="toggleSettings()">⚙️</button>
                        <button class="yt-btn" onclick="toggleFullscreen()">⛶</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Search & Playlist Section -->
    <div class="content-section">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="YouTube Video Link (သို့) ID ရိုက်ထည့်ပါ..." onkeydown="if(event.key==='Enter') loadCustomVideo()">
            <button onclick="loadCustomVideo()">ဖွင့်မည်</button>
        </div>

        <div id="playlistContainer"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        let player;
        let isReady = false;
        let overlayTimeout;
        let currentIdx = 0;

        const playlist = [
            { id: "M7lc1UVf-VE", title: "၁။ Overlord Bot အခြေခံ အသုံးပြုနည်း" },
            { id: "L_LUpnjgPso", title: "၂။ Signal ဖတ်နည်းနှင့် Order ပြင်ဆင်ခြင်း" },
            { id: "fJ9rUzIMcZQ", title: "၃။ Risk Management & Stop Loss" }
        ];

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytPlayer', {
                events: {
                    'onReady': () => {
                        isReady = true;
                        renderPlaylist();
                        startProgressTracker();
                    },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING) {
                            document.getElementById('playBtn').textContent = '⏸';
                            document.getElementById('centerPlayBtn').textContent = '⏸';
                            autoHideOverlay();
                        } else {
                            document.getElementById('playBtn').textContent = '▶';
                            document.getElementById('centerPlayBtn').textContent = '▶';
                            showOverlay();
                        }
                    }
                }
            });
        }

        // Play/Pause Control
        function togglePlay() {
            if (!isReady) return;
            if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        // Overlay Auto-Hide Management
        const wrapper = document.getElementById('ytPlayerWrapper');
        const overlay = document.getElementById('ytOverlay');

        wrapper.addEventListener('mousemove', showOverlay);
        wrapper.addEventListener('touchstart', showOverlay, {passive: true});

        function showOverlay() {
            overlay.classList.remove('hidden');
            clearTimeout(overlayTimeout);
            if (isReady && player.getPlayerState() === YT.PlayerState.PLAYING) {
                overlayTimeout = setTimeout(() => overlay.classList.add('hidden'), 3000);
            }
        }

        function autoHideOverlay() {
            clearTimeout(overlayTimeout);
            overlayTimeout = setTimeout(() => overlay.classList.add('hidden'), 2500);
        }

        // Scrubbing & Time Update
        const progressInput = document.getElementById('progressInput');
        const progressFill = document.getElementById('progressFill');

        progressInput.addEventListener('input', (e) => {
            progressFill.style.width = e.target.value + '%';
        });

        progressInput.addEventListener('change', (e) => {
            if (isReady) {
                const duration = player.getDuration();
                player.seekTo((e.target.value / 100) * duration, true);
            }
        });

        function startProgressTracker() {
            setInterval(() => {
                if (isReady && player.getPlayerState() === YT.PlayerState.PLAYING) {
                    const current = player.getCurrentTime();
                    const duration = player.getDuration();
                    if (duration > 0) {
                        const pct = (current / duration) * 100;
                        progressFill.style.width = pct + '%';
                        progressInput.value = pct;
                        document.getElementById('timeLabel').textContent = `${formatTime(current)} / ${formatTime(duration)}`;
                    }
                }
            }, 300);
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // Volume Controls
        const volumeSlider = document.getElementById('volumeSlider');
        volumeSlider.addEventListener('input', (e) => {
            if (isReady) {
                player.setVolume(e.target.value);
                document.getElementById('muteBtn').textContent = e.target.value == 0 ? '🔇' : '🔊';
            }
        });

        function toggleMute() {
            if (!isReady) return;
            if (player.isMuted()) {
                player.unMute();
                document.getElementById('muteBtn').textContent = '🔊';
            } else {
                player.mute();
                document.getElementById('muteBtn').textContent = '🔇';
            }
        }

        // Double Tap Quick Seek Gesture (+10s / -10s)
        let lastTap = 0;
        wrapper.addEventListener('touchend', (e) => {
            const now = new Date().getTime();
            const timespan = now - lastTap;
            if (timespan < 300 && timespan > 0) {
                const rect = wrapper.getBoundingClientRect();
                const touchX = e.changedTouches[0].clientX - rect.left;
                if (touchX < rect.width * 0.4) seekRelative(-10, 'rippleLeft');
                else if (touchX > rect.width * 0.6) seekRelative(10, 'rippleRight');
            }
            lastTap = now;
        });

        function seekRelative(sec, elementId) {
            if (!isReady) return;
            player.seekTo(player.getCurrentTime() + sec, true);
            const el = document.getElementById(elementId);
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 600);
        }

        // Settings Popup
        function toggleSettings() {
            const menu = document.getElementById('settingsMenu');
            menu.classList.toggle('show');
        }

        function setSpeed(spd) {
            if (isReady) player.setPlaybackRate(spd);
            toggleSettings();
        }

        function setQuality(q) {
            if (isReady) player.setPlaybackQuality(q);
            toggleSettings();
        }

        // Fullscreen Toggle
        function toggleFullscreen() {
            if (!document.fullscreenElement) wrapper.requestFullscreen().catch(()=>{});
            else document.exitFullscreen().catch(()=>{});
        }

        // Custom Link/ID Search
        function loadCustomVideo() {
            const input = document.getElementById('searchInput').value.trim();
            const match = input.match(/(?:youtu\.be\/|watch\?v=)([^#\&\?]+)/);
            const vidId = match ? match[1] : (input.length === 11 ? input : null);

            if (vidId && isReady) {
                player.loadVideoById(vidId);
                document.getElementById('videoTitle').textContent = `Direct Video (${vidId})`;
            }
        }

        function renderPlaylist() {
            const container = document.getElementById('playlistContainer');
            container.innerHTML = '';
            playlist.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = `playlist-card ${idx === currentIdx ? 'active' : ''}`;
                card.onclick = () => {
                    currentIdx = idx;
                    player.loadVideoById(item.id);
                    document.getElementById('videoTitle').textContent = item.title;
                    renderPlaylist();
                };
                card.innerHTML = `
                    <img src="https://img.youtube.com/vi/${item.id}/mqdefault.jpg">
                    <div>
                        <h4>${item.title}</h4>
                        <p>Overlord Trading Guide</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
