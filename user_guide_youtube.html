<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Overlord Bot Guide & Dynamic Learning Hub</title>

    <!-- Telegram WebApp JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- YouTube Iframe API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        :root {
            --primary-color: #ff0000;
            --bg-color: var(--tg-theme-bg-color, #0f0f0f);
            --card-bg: #1f1f1f;
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --btn-color: var(--tg-theme-button-color, #2481cc);
            --btn-text-color: var(--tg-theme-button-text-color, #ffffff);
            --badge-course: #ff9800;
            --badge-playlist: #2196f3;
            --badge-free: #4caf50;
        }

        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: calc(15px + env(safe-area-inset-top));
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }

        .header-text {
            text-align: center;
            margin-bottom: 15px;
            transition: opacity 0.3s ease;
            width: 100%;
            max-width: 800px;
        }

        .header-text h2 {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
            color: #ffffff;
        }

        .header-text p {
            color: var(--hint-color);
            font-size: 0.85rem;
            margin: 0;
            line-height: 1.4;
        }

        /* Video Container & Touch Gestures UI */
        .video-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            margin: 0 auto; 
            width: 100%; 
            max-width: 800px; 
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            touch-action: none;
        }

        .full-shield-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            background: rgba(0, 0, 0, 0.001);
            touch-action: none;
            cursor: pointer;
        }

        .hud-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 60;
            opacity: 0;
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .hud-indicator.show {
            opacity: 1;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
            transform-origin: center center;
            transition: filter 0.1s ease, transform 0.05s ease-out;
        }

        /* In-Player Scrubber Progress Bar Overlay */
        .progress-overlay-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 55;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
            padding: 8px 12px 6px 12px;
            display: flex;
            align-items: center;
        }

        .progress-bar-container {
            position: relative;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            border-radius: 3px;
            width: 0%;
        }

        .seek-input {
            position: absolute;
            top: -5px;
            left: 0;
            width: 100%;
            height: 15px;
            opacity: 0;
            cursor: pointer;
            z-index: 60;
            margin: 0;
        }

        /* Custom Fullscreen Mode */
        .video-container.custom-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            z-index: 999999 !important;
            border-radius: 0 !important;
            margin: 0 !important;
        }

        .video-container.custom-fullscreen iframe {
            height: 100vh !important;
            aspect-ratio: auto !important;
        }

        @media screen and (orientation: landscape) {
            body {
                padding: 0;
                background-color: #000;
            }
            .header-text, .controls-bar, .whiteboard-card, .search-box-container, .learning-hub-section, .playlist-section {
                display: none !important;
            }
            .video-container {
                max-width: 100vw;
                height: 100vh;
                border-radius: 0;
            }
            .video-container iframe {
                height: 100vh;
            }
        }

        /* Control Panel Bar */
        .controls-bar {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 800px;
            flex-wrap: wrap;
        }

        .btn-control {
            background-color: var(--btn-color);
            color: var(--btn-text-color);
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 4px;
            outline: none;
        }

        select.btn-control {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding-right: 26px;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 6px center;
            background-size: 16px;
        }

        .btn-control.active {
            background-color: #28a745;
        }

        .btn-control:active {
            opacity: 0.8;
        }

        .time-text {
            font-size: 0.8rem;
            color: var(--text-color);
            font-family: monospace;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
        }

        /* Classroom Whiteboard / Interactive Document Section */
        .whiteboard-card {
            background-color: var(--card-bg, #1e1e1e);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            margin-top: 18px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .board-title {
            font-size: 1.02rem;
            color: #4da6ff;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .board-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .lang-select-box {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .copy-btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .copy-btn:hover { background-color: #388e3c; }
        .copy-btn:active { opacity: 0.8; }

        .key-btn {
            background-color: #d84315;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .script-document {
            max-height: 320px;
            overflow-y: auto;
            line-height: 1.7;
            font-size: 0.95rem;
            padding-right: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .script-line {
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, border 0.2s;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            word-break: break-word;
        }

        .script-line:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .script-line.active {
            background-color: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            border-left: 4px solid #ffd700;
            font-weight: bold;
        }

        .timestamp-badge {
            font-size: 0.75rem;
            color: #aaa;
            background: #2a2a2a;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .loading-text {
            color: #ffd700;
            font-style: italic;
            padding: 15px;
            text-align: center;
        }

        /* Search Section UI */
        .search-box-container {
            width: 100%;
            max-width: 800px;
            margin-top: 18px;
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        .search-input:focus {
            border-color: var(--btn-color);
        }

        /* Categorized Video / Playlist Hub Section */
        .learning-hub-section {
            width: 100%;
            max-width: 800px;
            margin-top: 20px;
        }

        .category-header {
            font-weight: bold;
            margin: 18px 0 10px 0;
            color: #ffbc00;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
        }

        .item-card-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-card {
            display: flex;
            gap: 12px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
            border-left: 4px solid transparent;
        }

        .item-card:active, .item-card.active {
            background: #2a2a2a;
            border-left-color: var(--primary-color);
        }

        .item-thumb-wrapper {
            position: relative;
            width: 110px;
            aspect-ratio: 16 / 9;
            flex-shrink: 0;
        }

        .item-thumb {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            object-fit: cover;
        }

        .playlist-badge-icon {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: bold;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .item-info h4 {
            margin: 0 0 6px 0;
            font-size: 0.88rem;
            color: #ffffff;
            line-height: 1.3;
        }

        .badge-tag {
            display: inline-block;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
            width: fit-content;
        }

        .badge-course { background-color: var(--badge-course); }
        .badge-playlist { background-color: var(--badge-playlist); }
        .badge-free { background-color: var(--badge-free); }

        /* Dynamic Playlist Queue Section (Search / RSS) */
        .playlist-section {
            width: 100%;
            max-width: 800px;
            margin-top: 15px;
        }

        .playlist-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        .video-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .video-card {
            display: flex;
            gap: 12px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .video-card:active, .video-card.active {
            background: #333;
            border-left: 4px solid var(--primary-color);
        }

        .video-thumb {
            width: 110px;
            aspect-ratio: 16 / 9;
            border-radius: 6px;
            object-fit: cover;
        }

        .video-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .video-info h4 {
            margin: 0 0 4px 0;
            font-size: 0.9rem;
            color: #ffffff;
            line-height: 1.3;
        }

        .video-info p {
            margin: 0;
            font-size: 0.75rem;
            color: var(--hint-color);
        }
    </style>
</head>
<body oncontextmenu="return false;">

        let isSeeking = false;
        let currentSubState = 0;

        let activeLessonData = [
            { start: 10, duration: 5, text: "မင်္ဂလာပါ၊ ဒီနေ့ သင်ခန်းစာမှာတော့ YouTube Iframe Embedded Player များကို Custom လုပ်နည်းများကို ရှင်းပြပေးသွားမှာ ဖြစ်ပါတယ်။" },
            { start: 21, duration: 6, text: "ပထမဦးစွာ iframe embed များကို Desktop browser များတွင် ထည့်သွင်းအသုံးပြုပုံနှင့် ပါရာမီတာများကို လေ့လာပါမည်။" },
            { start: 30, duration: 7, text: "YouTube Player Constructor နှင့် HTML iframe tag တို့ကို အသုံးပြု၍ ဗီဒီယိုများကို စိတ်ကြိုက် ထိန်းချုပ်နိုင်ပါသည်။" },
            { start: 112, duration: 6, text: "autohide ပါရာမီတာကို အသုံးပြုခြင်းဖြင့် ဗီဒီယိုဖွင့်နေစဉ်အတွင်း အောက်ခြေကంట်ရိုးရှင်းများကို အလိုအလျောက် ပျောက်ကွယ်စေနိုင်ပါသည်။" },
            { start: 200, duration: 6, text: "controls ၏ တန်ဖိုးကို 2 အဖြစ် သတ်မှတ်ခြင်းဖြင့် Flash Player ကို အစောပိုင်း မတင်ဘဲ Thumbnail နှိပ်မှသာ တင်ပေးခြင်းဖြင့် Performance ကို များစွာ တိုးတက်စေနိုင်ပါသည်။" }
        ];

        let activeLineIndex = -1;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytPlayer', {
                events: {
                    'onReady': () => { 
                        isPlayerReady = true; 
                        updateQualityMenu();
                        renderCategorizedHub();
                        renderPlaylist();
                        renderScriptDocument(activeLessonData);
                        startProgressLoop();
                    },
                    'onStateChange': (event) => {
                        if (event.data === YT.PlayerState.PLAYING) {
                            updateQualityMenu();
                            playStateIcon.textContent = '⏸';
                        } else {
                            playStateIcon.textContent = '▶';
                        }
                        if (event.data === YT.PlayerState.ENDED) nextVideo();
                    },
                    'onError': (event) => {
                        console.error("YouTube Player Error Code:", event.data);
                        showHUD("⚠️ Video ဖွင့်၍မရပါ (သို့မဟုတ် Unavailable ဖြစ်နေသည်)");
                    }
                }
            });
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
        }

        function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            const extractedId = extractVideoId(query);
            if (extractedId) {
                playlistData.unshift({ id: extractedId, title: "Custom Link (" + extractedId + ")", duration: "Direct" });
                currentVideoIndex = 0;
                renderPlaylist();
                playVideoAtIndex(0);
                showHUD("▶ Link ဖြင့် ဖွင့်နေပါပြီ");
                searchInput.value = '';
                return;
            }

            const filtered = playlistData.filter(item => item.title.toLowerCase().includes(query.toLowerCase()));
            renderCustomPlaylist(filtered);
            showHUD(`🔍 "${query}" ရှာဖွေပြီးပါပြီ`);
        }

        function renderCustomPlaylist(list) {
            const container = document.getElementById('videoListContainer');
            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = '<div style="color:#aaa; padding:10px; font-size:0.85rem;">ရှာဖွေမှုနှင့် ကိုက်ညီသော ဗီဒီယို မရှိပါ။</div>';
                return;
            }
            list.forEach((vid) => {
                const card = document.createElement('div');
                card.className = `video-card ${vid.id === (playlistData[currentVideoIndex]?.id) ? 'active' : ''}`;
                card.onclick = () => {
                    const idx = playlistData.findIndex(p => p.id === vid.id);
                    if (idx !== -1) playVideoAtIndex(idx);
                };
                card.innerHTML = `
                    <img class="video-thumb" src="https://img.youtube.com/vi/${vid.id}/mqdefault.jpg">
                    <div class="video-info">
                        <h4>${vid.title}</h4>
                        <p>⏱ ${vid.duration}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderCategorizedHub() {
            const container = document.getElementById('learningHubContainer');
            container.innerHTML = '';
            courseData.forEach((section) => {
                const header = document.createElement('div');
                header.className = 'category-header';
                header.textContent = section.category;
                container.appendChild(header);

                const cardList = document.createElement('div');
                cardList.className = 'item-card-list';

                section.items.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.onclick = () => playItem(item, card);
                    let thumbUrl = `https://img.youtube.com/vi/${item.id || item.thumbVideoId || "M7lc1UVf-VE"}/mqdefault.jpg`;

                    card.innerHTML = `
                        <div class="item-thumb-wrapper">
                            <img class="item-thumb" src="${thumbUrl}">
                            ${item.type === 'playlist' ? '<span class="playlist-badge-icon">☰ PLAYLIST</span>' : ''}
                        </div>
                        <div class="item-info">
                            <h4>${item.title}</h4>
                            <span class="badge-tag ${item.badgeClass}">${item.tag}</span>
                        </div>
                    `;
                    cardList.appendChild(card);
                });
                container.appendChild(cardList);
            });
        }

        function playItem(item, cardElement) {
            if (!isPlayerReady) return;
            document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
            if (cardElement) cardElement.classList.add('active');

            if (item.type === "video") {
                player.loadVideoById(item.id);
                showHUD(`▶ ${item.title}`);
            } else if (item.type === "playlist") {
                player.loadPlaylist({ listType: 'playlist', list: item.id, index: 0, startSeconds: 0 });
                showHUD(`📺 Playlist Loaded`);
            }
        }

        function renderPlaylist() {
            renderCustomPlaylist(playlistData);
        }

        function playVideoAtIndex(index) {
            if (!isPlayerReady || !playlistData[index]) return;
            currentVideoIndex = index;
            const vid = playlistData[index];
            player.loadVideoById(vid.id);
            renderPlaylist();
            showHUD(`▶ ${vid.title}`);
        }

        function nextVideo() {
            if (!isPlayerReady) return;
            if (currentVideoIndex < playlistData.length - 1) playVideoAtIndex(currentVideoIndex + 1);
        }

        function prevVideo() {
            if (!isPlayerReady) return;
            if (currentVideoIndex > 0) playVideoAtIndex(currentVideoIndex - 1);
        }

        seekInput.addEventListener('input', (e) => {
            isSeeking = true;
            progressFill.style.width = e.target.value + '%';
        });

        seekInput.addEventListener('change', (e) => {
            if (isPlayerReady) {
                const duration = player.getDuration();
                player.seekTo((e.target.value / 100) * duration, true);
            }
            isSeeking = false;
        });

        function startProgressLoop() {
            setInterval(() => {
                if (isPlayerReady && !isSeeking && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
                    const current = player.getCurrentTime();
                    const duration = player.getDuration();
                    if (duration > 0) {
                        const pct = (current / duration) * 100;
                        progressFill.style.width = pct + '%';
                        seekInput.value = pct;
                        timeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
                    }
                }
                syncScriptWithVideo();
            }, 300);
        }

        function formatTime(sec) {
            if (isNaN(sec) || sec < 0) return "00:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function renderScriptDocument(data) {
            const scriptBox = document.getElementById('scriptBox');
            if (!scriptBox) return;
            scriptBox.innerHTML = '';
            data.forEach((item, index) => {
                const line = document.createElement('div');
                line.className = 'script-line';
                line.id = `line-${index}`;
                const minutes = Math.floor(item.start / 60);
                const seconds = Math.floor(item.start % 60).toString().padStart(2, '0');
                line.innerHTML = `<span class="timestamp-badge">[${minutes}:${seconds}]</span> <span>${item.text}</span>`;
                line.onclick = () => {
                    if (isPlayerReady && player.seekTo) {
                        player.seekTo(item.start, true);
                        player.playVideo();
                        showHUD(`⏱ Jump to ${minutes}:${seconds}`);
                    }
                };
                scriptBox.appendChild(line);
            });
        }

        function syncScriptWithVideo() {
            if (!isPlayerReady || !player || typeof player.getCurrentTime !== 'function') return;
            try {
                const currentTime = player.getCurrentTime();
                const currentIndex = activeLessonData.findIndex(item => currentTime >= item.start && currentTime < (item.start + (item.duration || 5)));
                if (currentIndex !== -1 && currentIndex !== activeLineIndex) {
                    if (activeLineIndex !== -1) {
                        const prevLine = document.getElementById(`line-${activeLineIndex}`);
                        if (prevLine) prevLine.classList.remove('active');
                    }
                    const currentLine = document.getElementById(`line-${currentIndex}`);
                    if (currentLine) {
                        currentLine.classList.add('active');
                        currentLine.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                    activeLineIndex = currentIndex;
                }
            } catch(e) {}
        }

        function copyFullNotes() {
            const fullText = activeLessonData.map(item => item.text).join('\n');
            navigator.clipboard.writeText(fullText).then(() => {
                showHUD("📋 Notes Copied!");
                alert('✅ မှတ်စု စာသားအကုန်လုံးကို Copy ယူပြီးပါပြီ။');
            });
        }

        function configureUserApiKey() {
            const key = prompt("ကျေးဇူးပြု၍ သင့်ကိုယ်ပိုင် Gemini API Key ထည့်ပါ (BYOK):", USER_GEMINI_API_KEY);
            if (key !== null) {
                USER_GEMINI_API_KEY = key.trim();
                localStorage.setItem('user_gemini_api_key', USER_GEMINI_API_KEY);
                showHUD("🔑 API Key သိမ်းဆည်းပြီးပါပြီ");
            }
        }

        async function changeLanguage(targetLang) {
            const scriptBox = document.getElementById('scriptBox');
            scriptBox.innerHTML = `<div class="loading-text">⏳ ${targetLang} ဘာသာသို့ ဘာသာပြန်ဆိုနေပါသည်...</div>`;

            const apiKey = USER_GEMINI_API_KEY || CENTRAL_GEMINI_API_KEY;
            if (!apiKey || apiKey.startsWith("__")) {
                scriptBox.innerHTML = `<div style="color:#ff6b6b; padding:15px; text-align:center;">⚠️ API Key မရှိပါ။ "Key" ခလုတ်ကိုနှိပ်၍ ထည့်သွင်းပေးပါ။</div>`;
                return;
            }

            try {
                const promptText = `Translate the following educational notes into ${targetLang}. Keep the exact JSON array structure format with start, duration, and text properties:
${JSON.stringify(activeLessonData)}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                });

                const data = await response.json();
                const rawOutput = data.candidates[0].content.parts[0].text;
                const cleanJson = rawOutput.replace(/```json/g, '').replace(/```/g, '').trim();
                const translatedData = JSON.parse(cleanJson);

                if (Array.isArray(translatedData)) {
                    activeLessonData = translatedData;
                    renderScriptDocument(activeLessonData);
                    showHUD(`✅ ${targetLang} သို့ ဘာသာပြန်ပြီးပါပြီ`);
                }
            } catch (err) {
                console.error("Translation Error:", err);
                scriptBox.innerHTML = `<div style="color:#ff6b6b; padding:15px; text-align:center;">⚠️ ဘာသာပြန်ဆိုမှု မအောင်မြင်ပါ။ API Key စစ်ဆေးပါ။</div>`;
            }
        }

        function speakText(text, lang = 'en-US') {
            if (!('speechSynthesis' in window) || !isVoiceOverEnabled) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            window.speechSynthesis.speak(utterance);
        }

        function toggleVoiceOver() {
            isVoiceOverEnabled = !isVoiceOverEnabled;
            if (isVoiceOverEnabled) {
                ttsBtn.classList.add('active');
                ttsBtn.textContent = "🔊 Voice: On";
                showHUD("🔊 Voice Read Aloud: Enabled");
            } else {
                ttsBtn.classList.remove('active');
                ttsBtn.textContent = "🔊 Voice: Off";
                showHUD("🔇 Voice Read Aloud: Disabled");
                window.speechSynthesis.cancel();
            }
        }

        function changeSubtitle(langCode) {
            if (!isPlayerReady) return;
            try {
                if (langCode === 'off') {
                    player.setOption('captions', 'track', {});
                    showHUD("💬 စာတန်းထိုး: ပိတ်ပါသည်");
                } else {
                    player.setOption('captions', 'track', {'languageCode': langCode});
                    showHUD(`💬 Subtitle: ${langCode.toUpperCase()}`);
                }
            } catch (e) {
                showHUD("💬 Subtitle မရရှိနိုင်ပါ");
            }
        }

        function updateQualityMenu() {
            if (!isPlayerReady) return;
            try {
                const qualities = player.getAvailableQualityLevels();
                if (qualities && qualities.length > 0) {
                    const currentQual = player.getPlaybackQuality();
                    qualitySelect.innerHTML = '';
                    qualities.forEach(q => {
                        const opt = document.createElement('option');
                        opt.value = q;
                        opt.textContent = `⚙️ ${q}`;
                        if (q === currentQual) opt.selected = true;
                        qualitySelect.appendChild(opt);
                    });
                }
            } catch(e) {}
        }

        function changeQuality(val) {
            if (!isPlayerReady) return;
            try {
                player.setPlaybackQuality(val);
                showHUD(`⚙️ Quality: ${val}`);
            } catch(e) {}
        }

        let hudTimeout;
        function showHUD(text) {
            hudIndicator.textContent = text;
            hudIndicator.classList.add('show');
            clearTimeout(hudTimeout);
            hudTimeout = setTimeout(() => hudIndicator.classList.remove('show'), 1200);
        }

        function togglePlayPause() {
            if (!isPlayerReady) return;
            if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                player.pauseVideo();
                showHUD("⏸ Paused");
            } else {
                player.playVideo();
                showHUD("▶ Playing");
            }
        }

        function toggleManualFullscreen() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            const isFullscreen = videoBox.classList.contains('custom-fullscreen');

            if (!isFullscreen) {
                videoBox.classList.add('custom-fullscreen');
                btnText.textContent = "ပုံမှန်အတိုင်း ပြန်ထားမည်";
                btnIcon.textContent = "✕";
                if (videoBox.requestFullscreen) videoBox.requestFullscreen().catch(() => {});
            } else {
                videoBox.classList.remove('custom-fullscreen');
                btnText.textContent = "မျက်နှာပြင် အပြည့်ကြည့်မည် (Zoom)";
                btnIcon.textContent = "⛶";
                if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen().catch(() => {});
            }
        }
    </script>
</body>
</html>
