<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Overlord Bot Guide & Dynamic Search Player</title>

    <!-- Telegram WebApp JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- YouTube Iframe API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        :root {
            --primary-color: #ff0000;
            --bg-color: var(--tg-theme-bg-color, #0f0f0f);
            --card-bg: #1f1f1f;
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --btn-color: var(--tg-theme-button-color, #2481cc);
            --btn-text-color: var(--tg-theme-button-text-color, #ffffff);
        }

        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: calc(15px + env(safe-area-inset-top));
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }

        .header-text {
            text-align: center;
            margin-bottom: 15px;
            transition: opacity 0.3s ease;
            width: 100%;
            max-width: 800px;
        }

        .header-text h2 {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
        }

        .header-text p {
            color: var(--hint-color);
            font-size: 0.85rem;
            margin: 0;
            line-height: 1.4;
        }

        /* Video Container & Gestures */
        .video-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            margin: 0 auto; 
            width: 100%; 
            max-width: 800px; 
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            touch-action: none;
        }

        .full-shield-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            background: rgba(0, 0, 0, 0.001);
            touch-action: none;
            cursor: pointer;
        }

        .hud-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 60;
            opacity: 0;
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hud-indicator.show {
            opacity: 1;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
            transform-origin: center center;
            transition: filter 0.1s ease, transform 0.05s ease-out;
        }

        /* In-Player Scrubber Progress Bar Overlay */
        .progress-overlay-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 55;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            padding: 8px 12px 6px 12px;
            display: flex;
            align-items: center;
        }

        .progress-bar-container {
            position: relative;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            border-radius: 3px;
            width: 0%;
        }

        .seek-input {
            position: absolute;
            top: -5px;
            left: 0;
            width: 100%;
            height: 15px;
            opacity: 0;
            cursor: pointer;
            z-index: 60;
            margin: 0;
        }

        /* Fullscreen Mode Optimization */
        .video-container.custom-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            z-index: 999999 !important;
            border-radius: 0 !important;
            margin: 0 !important;
        }

        .video-container.custom-fullscreen iframe {
            height: 100vh !important;
            aspect-ratio: auto !important;
        }

        @media screen and (orientation: landscape) {
            body {
                padding: 0;
                background-color: #000;
            }
            .header-text, .controls-bar, .search-box-container, .playlist-section {
                display: none !important;
            }
            .video-container {
                max-width: 100vw;
                height: 100vh;
                border-radius: 0;
            }
            .video-container iframe {
                height: 100vh;
            }
        }

        /* Control Panel Bar */
        .controls-bar {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 800px;
            flex-wrap: wrap;
        }

        .btn-control {
            background-color: var(--btn-color);
            color: var(--btn-text-color);
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 4px;
            outline: none;
        }

        select.btn-control {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding-right: 26px;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 6px center;
            background-size: 16px;
        }

        .btn-control.active {
            background-color: #28a745;
        }

        .btn-control:active {
            opacity: 0.8;
        }

        .time-text {
            font-size: 0.8rem;
            color: var(--text-color);
            font-family: monospace;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
        }

        /* Search Section UI */
        .search-box-container {
            width: 100%;
            max-width: 800px;
            margin-top: 18px;
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        .search-input:focus {
            border-color: var(--btn-color);
        }

        /* Playlist Queue Section */
        .playlist-section {
            width: 100%;
            max-width: 800px;
            margin-top: 15px;
        }

        .playlist-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        .video-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .video-card {
            display: flex;
            gap: 12px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .video-card:active, .video-card.active {
            background: #333;
            border-left: 4px solid var(--primary-color);
        }

        .video-thumb {
            width: 110px;
            aspect-ratio: 16 / 9;
            border-radius: 6px;
            object-fit: cover;
        }

        .video-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .video-info h4 {
            margin: 0 0 4px 0;
            font-size: 0.9rem;
            color: #ffffff;
            line-height: 1.3;
        }

        .video-info p {
            margin: 0;
            font-size: 0.75rem;
            color: var(--hint-color);
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header-text" id="headerText">
        <h2>Overlord Bot အသုံးပြုနည်း လမ်းညွှန်</h2>
        <p>Bot ကို စတင်အသုံးပြုပုံနှင့် Signal များဖတ်နည်း လမ်းညွှန် ဗီဒီယိုများ</p>
    </div>

    <!-- Video Player Container -->
    <div class="video-container" id="videoBox">
        <div class="full-shield-overlay" id="gestureOverlay"></div>
        <div class="hud-indicator" id="hudIndicator"></div>

        <iframe 
            id="ytPlayer"
            src="Overlord_user_guide: https://www.youtube.com/embed/videoseries?list=PLATyixI4j2D8&enablejsapi=1&rel=0&modestbranding=1" 
            title="Overlord Bot Guide" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>

        <!-- In-Player Progress Timeline Overlay -->
        <div class="progress-overlay-bar">
            <div class="progress-bar-container">
                <div class="progress-fill" id="progressFill"></div>
                <input type="range" class="seek-input" id="seekInput" min="0" max="100" value="0" step="0.1">
            </div>
        </div>
    </div>

    <!-- Control Buttons Panel -->
    <div class="controls-bar" id="controlsBar">
        <button class="btn-control" onclick="prevVideo()">⏮ ရှေ့တစ်ပုဒ်</button>
        <button class="btn-control" onclick="togglePlayPause()"><span id="playStateIcon">▶</span> သင်္ကေတ</button>
        <button class="btn-control" onclick="nextVideo()">နောက်တစ်ပုဒ် ⏭</button>

        <select class="btn-control" id="subtitleSelect" onchange="changeSubtitle(this.value)">
            <option value="off">💬 CC: ပိတ်မည်</option>
            <option value="my">💬 မြန်မာစာတန်းထိုး</option>
            <option value="en">💬 English Subtitle</option>
            <option value="th">💬 ไทย Subtitle</option>
            <option value="ja">💬 日本語 Subtitle</option>
            <option value="ko">💬 한국어 Subtitle</option>
        </select>

        <button class="btn-control" id="ttsBtn" onclick="toggleVoiceOver()">🔊 Voice: Off</button>

        <select class="btn-control" id="qualitySelect" onchange="changeQuality(this.value)">
            <option value="auto">⚙️ Quality: Auto</option>
            <option value="hd1080">⚙️ 1080p (HD)</option>
            <option value="hd720">⚙️ 720p (HD)</option>
            <option value="large">⚙️ 480p</option>
            <option value="medium">⚙️ 360p</option>
        </select>

        <button class="btn-control" onclick="toggleManualFullscreen()">
            <span id="btnIcon">⛶</span> <span id="btnText">မျက်နှာပြင် အပြည့်ကြည့်မည် (Zoom)</span>
        </button>

        <span class="time-text" id="timeDisplay">00:00 / 00:00</span>
    </div>

    <!-- YouTube Search Bar Section -->
    <div class="search-box-container">
        <input type="text" id="searchInput" class="search-input" placeholder="YouTube Link (သို့) ဗီဒီယိုခေါင်းစဉ် ရှာရန်..." onkeydown="if(event.key==='Enter') performSearch()">
        <button class="btn-control" onclick="performSearch()">🔍 ရှာမည်</button>
    </div>

    <!-- Continuous Playlist Queue Section -->
    <div class="playlist-section">
        <div class="playlist-title" id="playlistTitleHeader">📚 လမ်းညွှန် ဗီဒီယိုများ စာရင်း</div>
        <div class="video-list" id="videoListContainer"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // API Key မလိုဘဲ သုံးနိုင်သော Config များ (မိမိ၏ ID အမှန်များကို ထည့်သွင်းပါ)
        const YOUTUBE_API_KEY = ""; 
        const PLAYLIST_ID = "https://www.youtube.com/embed/videoseries?list=PLATyixI4j2D8&enablejsapi=1&rel=0&modestbranding=1"; // မိမိ၏ YouTube Playlist ID အမှန်ကို ဒီနေရာတွင် ပြင်ဆင်နိုင်ပါသည်
        const CHANNEL_ID = "UCSyM27DAnWU9Yd60eqCPufg"; // သို့မဟုတ် Channel ID

        const videoBox = document.getElementById('videoBox');
        const ytIframe = document.getElementById('ytPlayer');
        const gestureOverlay = document.getElementById('gestureOverlay');
        const hudIndicator = document.getElementById('hudIndicator');
        const qualitySelect = document.getElementById('qualitySelect');
        const subtitleSelect = document.getElementById('subtitleSelect');
        const ttsBtn = document.getElementById('ttsBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const playStateIcon = document.getElementById('playStateIcon');
        const progressFill = document.getElementById('progressFill');
        const seekInput = document.getElementById('seekInput');
        const timeDisplay = document.getElementById('timeDisplay');
        const searchInput = document.getElementById('searchInput');

        // Fallback Playlist Data
        let playlistData = [
            { id: "M7lc1UVf-VE", title: "၁။ Overlord Bot အခြေခံ အသုံးပြုနည်း", duration: "05:20" },
            { id: "L_LUpnjgPso", title: "၂။ Signal များဖတ်ပြီး Trade ဝင်နည်း", duration: "08:15" },
            { id: "fJ9rUzIMcZQ", title: "၃။ Risk Management နှင့် Stop Loss ပြင်ဆင်နည်း", duration: "06:40" }
        ];

        let player;
        let isPlayerReady = false;
        let isVoiceOverEnabled = false;
        let currentVideoIndex = 0;
        let isSeeking = false;

        // RSS Feed မူဘောင်မှတစ်ဆင့် Playlist (သို့) Channel ဗီဒီယိုများကို API Key မလိုဘဲ တိုက်ရိုက်ဆွဲယူခြင်း
        async function fetchVideosFromRSS() {
            let rssUrl = "";
            if (PLAYLIST_ID && PLAYLIST_ID.length > 5) {
                rssUrl = `https://www.youtube.com/feeds/videos.xml?playlist_id=${PLAYLIST_ID}`;
            } else if (CHANNEL_ID) {
                rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;
            }

            if (!rssUrl) return;

            try {
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    playlistData = data.items.map((item, idx) => {
                        let videoId = "";
                        if (item.link.includes('v=')) {
                            videoId = item.link.split('v=')[1].split('&')[0];
                        } else {
                            videoId = item.guid.replace('yt:video:', '');
                        }

                        return {
                            id: videoId,
                            title: `${idx + 1}။ ${item.title}`,
                            duration: item.pubDate ? new Date(item.pubDate).toLocaleDateString() : "Video"
                        };
                    }).filter(v => v.id);

                    renderPlaylist();

                    // Saved State မရှိပါက ပထမဆုံး Video ကို စတင်ဖွင့်ပေးခြင်း
                    const savedVideoId = localStorage.getItem('last_yt_id');
                    if (isPlayerReady && !savedVideoId && playlistData.length > 0) {
                        playVideoAtIndex(0);
                    }
                }
            } catch (err) {
                console.error("RSS Fetch Error:", err);
            }
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytPlayer', {
                events: {
                    'onReady': () => { 
                        isPlayerReady = true; 
                        updateQualityMenu();
                        renderPlaylist();

                        // Resume position & Video from LocalStorage
                        const savedVideoId = localStorage.getItem('last_yt_id');
                        const savedTime = localStorage.getItem('last_yt_time');

                        if (savedVideoId) {
                            const idx = playlistData.findIndex(v => v.id === savedVideoId);
                            if (idx !== -1) currentVideoIndex = idx;
                            player.loadVideoById(savedVideoId, parseFloat(savedTime) || 0);
                        }

                        // RSS Feed မှတစ်ဆင့် Playlist / Channel Videos များကို လှမ်းယူမည်
                        fetchVideosFromRSS();

                        startProgressLoop();
                    },
                    'onStateChange': (event) => {
                        if (event.data === YT.PlayerState.PLAYING) {
                            updateQualityMenu();
                            playStateIcon.textContent = '⏸';
                        } else {
                            playStateIcon.textContent = '▶';
                        }

                        // Auto Play Next Video on End
                        if (event.data === YT.PlayerState.ENDED) {
                            nextVideo();
                        }
                    }
                }
            });
        }

        // Global Link & Context Protection (Excluding Input Bar)
        document.addEventListener('contextmenu', (e) => {
            if (e.target.tagName !== 'INPUT') e.preventDefault();
        });
        document.addEventListener('dragstart', (e) => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if (
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
            ) {
                e.preventDefault();
            }
        });

        // Search Logic (Direct Link or YouTube Search API)
        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
        }

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            const extractedId = extractVideoId(query);
            if (extractedId) {
                // Direct YouTube Link / ID pasted
                const newVid = { id: extractedId, title: "ထည့်သွင်းထားသော ဗီဒီယို (" + extractedId + ")", duration: "Custom Link" };
                playlistData.unshift(newVid);
                currentVideoIndex = 0;
                renderPlaylist();
                playVideoAtIndex(0);
                showHUD("▶ ဗီဒီယိုသစ် ဖွင့်နေပါသည်");
                searchInput.value = '';
                return;
            }

            // Keyword Search via YouTube Data API
            if (!YOUTUBE_API_KEY) {
                showHUD("⚠️ API Key လိုအပ်ပါသည်");
                alert("စာရိုက်၍ ရှာဖွေရန် Code ထဲရှိ YOUTUBE_API_KEY တွင် Key ထည့်ပေးပါ။ သို့မဟုတ် YouTube Video Link / ID ကို Paste လုပ်၍ ရှာနိုင်ပါသည်။");
                return;
            }

            try {
                showHUD("🔍 ရှာဖွေနေပါသည်...");
                const response = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=8&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    playlistData = data.items.map(item => ({
                        id: item.id.videoId,
                        title: item.snippet.title,
                        duration: item.snippet.channelTitle
                    }));
                    currentVideoIndex = 0;
                    document.getElementById('playlistTitleHeader').textContent = `🔍 ရှာဖွေတွေ့ရှိသည့် ဗီဒီယိုများ (${query})`;
                    renderPlaylist();
                    playVideoAtIndex(0);
                    showHUD("✅ ဗီဒီယိုများ တွေ့ရှိပါသည်");
                } else {
                    showHUD("❌ ဗီဒီယို မတွေ့ပါ");
                }
            } catch (err) {
                showHUD("❌ Search Error");
            }
        }

        // Playlist Queue Functions
        function renderPlaylist() {
            const container = document.getElementById('videoListContainer');
            container.innerHTML = '';
            playlistData.forEach((vid, index) => {
                const card = document.createElement('div');
                card.className = `video-card ${index === currentVideoIndex ? 'active' : ''}`;
                card.onclick = () => playVideoAtIndex(index);
                card.innerHTML = `
                    <img class="video-thumb" src="https://img.youtube.com/vi/${vid.id}/mqdefault.jpg">
                    <div class="video-info">
                        <h4>${vid.title}</h4>
                        <p>⏱ ကြာချိန် / Channel - ${vid.duration}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function playVideoAtIndex(index) {
            if (!isPlayerReady) return;
            currentVideoIndex = index;
            const vid = playlistData[index];
            player.loadVideoById(vid.id);
            renderPlaylist();
            showHUD(`▶ ${vid.title}`);
        }

        function nextVideo() {
            if (!isPlayerReady) return;
            if (currentVideoIndex < playlistData.length - 1) {
                playVideoAtIndex(currentVideoIndex + 1);
            } else if (player.nextVideo) {
                player.nextVideo();
            }
            showHUD("⏭ နောက်တစ်ပုဒ်");
        }

        function prevVideo() {
            if (!isPlayerReady) return;
            if (currentVideoIndex > 0) {
                playVideoAtIndex(currentVideoIndex - 1);
            } else if (player.previousVideo) {
                player.previousVideo();
            }
            showHUD("⏮ ရှေ့တစ်ပုဒ်");
        }

        // Timeline Progress Bar Scrubber
        seekInput.addEventListener('input', (e) => {
            isSeeking = true;
            progressFill.style.width = e.target.value + '%';
        });

        seekInput.addEventListener('change', (e) => {
            if (isPlayerReady) {
                const duration = player.getDuration();
                const seekToSec = (e.target.value / 100) * duration;
                player.seekTo(seekToSec, true);
            }
            isSeeking = false;
        });

        function startProgressLoop() {
            setInterval(() => {
                if (isPlayerReady && !isSeeking && player.getPlayerState() === YT.PlayerState.PLAYING) {
                    const current = player.getCurrentTime();
                    const duration = player.getDuration();
                    if (duration > 0) {
                        const pct = (current / duration) * 100;
                        progressFill.style.width = pct + '%';
                        seekInput.value = pct;
                        timeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
                        
                        // Storage Resume Feature
                        if (playlistData[currentVideoIndex]) {
                            localStorage.setItem('last_yt_id', playlistData[currentVideoIndex].id);
                            localStorage.setItem('last_yt_time', current);
                        }
                    }
                }
            }, 500);
        }

        function formatTime(sec) {
            if (isNaN(sec) || sec < 0) return "00:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Speech Engine (TTS)
        function speakText(text, lang = 'en-US') {
            if (!('speechSynthesis' in window) || !isVoiceOverEnabled) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            window.speechSynthesis.speak(utterance);
        }

        function toggleVoiceOver() {
            isVoiceOverEnabled = !isVoiceOverEnabled;
            if (isVoiceOverEnabled) {
                ttsBtn.classList.add('active');
                ttsBtn.textContent = "🔊 Voice: On";
                showHUD("🔊 Voice Read Aloud: Enabled");
                speakText("Voice readout enabled", "en-US");
            } else {
                ttsBtn.classList.remove('active');
                ttsBtn.textContent = "🔊 Voice: Off";
                showHUD("🔇 Voice Read Aloud: Disabled");
                window.speechSynthesis.cancel();
            }
        }

        // Subtitles & Quality
        function changeSubtitle(langCode) {
            if (!isPlayerReady) return;
            if (langCode === 'off') {
                player.unloadModule('captions');
                player.setOption('captions', 'track', {});
                showHUD("💬 စာတန်းထိုး: ပိတ်ပါသည်");
            } else {
                player.loadModule('captions');
                player.setOption('captions', 'track', {'languageCode': langCode});
                const selectedText = subtitleSelect.options[subtitleSelect.selectedIndex].text;
                showHUD(`${selectedText}`);
                if (isVoiceOverEnabled) speakText(`Subtitle changed to ${langCode}`, 'en-US');
            }
        }

        function updateQualityMenu() {
            if (!isPlayerReady) return;
            try {
                const qualities = player.getAvailableQualityLevels();
                if (qualities && qualities.length > 0) {
                    const currentQual = player.getPlaybackQuality();
                    qualitySelect.innerHTML = '';
                    qualities.forEach(q => {
                        const opt = document.createElement('option');
                        opt.value = q;
                        opt.textContent = `⚙️ ${formatQualityName(q)}`;
                        if (q === currentQual) opt.selected = true;
                        qualitySelect.appendChild(opt);
                    });
                }
            } catch(e) {}
        }

        function formatQualityName(q) {
            const names = {'highres': '4K / 2K', 'hd1080': '1080p (HD)', 'hd720': '720p (HD)', 'large': '480p', 'medium': '360p', 'small': '240p', 'tiny': '144p', 'auto': 'Auto'};
            return names[q] || q;
        }

        function changeQuality(val) {
            if (!isPlayerReady) return;
            player.setPlaybackQuality(val);
            showHUD(`⚙️ Quality: ${formatQualityName(val)}`);
        }

        // Touch Gesture Logic
        let touchStartX = 0, touchStartY = 0;
        let currentBrightness = 1.0, currentVolume = 100, currentZoom = 1.0;
        let initialPinchDist = 0, lastTapTime = 0, tapTimeout;
        let isSeekingGesture = false, isVolumeGesture = false, isBrightnessGesture = false;
        let seekDeltaTime = 0, hudTimeout;

        function showHUD(text) {
            hudIndicator.textContent = text;
            hudIndicator.classList.add('show');
            clearTimeout(hudTimeout);
            hudTimeout = setTimeout(() => hudIndicator.classList.remove('show'), 1000);
        }

        function getDistance(t1, t2) {
            return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        }

        gestureOverlay.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialPinchDist = getDistance(e.touches[0], e.touches[1]);
            } else if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                isSeekingGesture = isVolumeGesture = isBrightnessGesture = false;

                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;

                if (tapLength < 300 && tapLength > 0) {
                    clearTimeout(tapTimeout);
                    handleDoubleTap(touchStartX);
                } else {
                    tapTimeout = setTimeout(() => {
                        if (!isSeekingGesture && !isVolumeGesture && !isBrightnessGesture) {
                            togglePlayPause();
                        }
                    }, 300);
                }
                lastTapTime = currentTime;
            }
        }, { passive: true });

        gestureOverlay.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const newDist = getDistance(e.touches[0], e.touches[1]);
                if (initialPinchDist > 0) {
                    currentZoom = Math.min(Math.max(1.0, currentZoom * (newDist / initialPinchDist)), 3.0);
                    ytIframe.style.transform = `scale(${currentZoom})`;
                    showHUD(`🔍 Zoom: ${currentZoom.toFixed(1)}x`);
                    initialPinchDist = newDist;
                }
            } else if (e.touches.length === 1) {
                const diffX = e.touches[0].clientX - touchStartX;
                const diffY = e.touches[0].clientY - touchStartY;
                const rect = gestureOverlay.getBoundingClientRect();

                if (!isSeekingGesture && !isVolumeGesture && !isBrightnessGesture) {
                    if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 15) {
                        isSeekingGesture = true;
                        clearTimeout(tapTimeout);
                    } else if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 15) {
                        clearTimeout(tapTimeout);
                        if (touchStartX < rect.width / 2) isBrightnessGesture = true;
                        else isVolumeGesture = true;
                    }
                }

                if (isBrightnessGesture) {
                    currentBrightness = Math.min(Math.max(0.2, currentBrightness - diffY * 0.003), 1.5);
                    ytIframe.style.filter = `brightness(${currentBrightness})`;
                    showHUD(`☀️ Brightness: ${Math.round((currentBrightness / 1.5) * 100)}%`);
                    touchStartY = e.touches[0].clientY;
                }

                if (isVolumeGesture && isPlayerReady) {
                    currentVolume = Math.min(Math.max(0, currentVolume - diffY * 0.2), 100);
                    player.setVolume(currentVolume);
                    showHUD(`🔊 Volume: ${Math.round(currentVolume)}%`);
                    touchStartY = e.touches[0].clientY;
                }

                if (isSeekingGesture) {
                    seekDeltaTime = Math.round(diffX * 0.15);
                    showHUD(`${seekDeltaTime > 0 ? "⏩ +" : "⏪ "}${seekDeltaTime}s`);
                }
            }
        }, { passive: true });

        gestureOverlay.addEventListener('touchend', () => {
            if (isSeekingGesture && isPlayerReady && seekDeltaTime !== 0) {
                player.seekTo(player.getCurrentTime() + seekDeltaTime, true);
                seekDeltaTime = 0;
            }
            isSeekingGesture = isVolumeGesture = isBrightnessGesture = false;
        });

        function handleDoubleTap(xPos) {
            if (!isPlayerReady) return;
            const rect = gestureOverlay.getBoundingClientRect();
            const currentTime = player.getCurrentTime();

            if (xPos < rect.width * 0.4) {
                player.seekTo(currentTime - 10, true);
                showHUD("⏪ -10 Seconds");
            } else if (xPos > rect.width * 0.6) {
                player.seekTo(currentTime + 10, true);
                showHUD("⏩ +10 Seconds");
            } else {
                togglePlayPause();
            }
        }

        function togglePlayPause() {
            if (!isPlayerReady) return;
            if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                player.pauseVideo();
                showHUD("⏸ Paused");
            } else {
                player.playVideo();
                showHUD("▶ Playing");
            }
        }

        function toggleManualFullscreen() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            const isFullscreen = videoBox.classList.contains('custom-fullscreen');

            if (!isFullscreen) {
                videoBox.classList.add('custom-fullscreen');
                btnText.textContent = "ပုံမှန်အတိုင်း ပြန်ထားမည်";
                btnIcon.textContent = "✕";
                if (videoBox.requestFullscreen) videoBox.requestFullscreen().catch(() => {});
            } else {
                videoBox.classList.remove('custom-fullscreen');
                btnText.textContent = "မျက်နှာပြင် အပြည့်ကြည့်မည် (Zoom)";
                btnIcon.textContent = "⛶";
                if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen().catch(() => {});
            }
        }

        document.addEventListener("fullscreenchange", () => {
            if (!document.fullscreenElement) {
                videoBox.classList.remove('custom-fullscreen');
                btnText.textContent = "မျက်နှာပြင် အပြည့်ကြည့်မည် (Zoom)";
                btnIcon.textContent = "⛶";
            }
        });
    </script>
</body>
</html>
