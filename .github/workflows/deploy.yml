name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # မိမိ main branch နာမည်ဖြစ်ရမည်

# Bot ကို Write Permission သီးသန့် ပေးခြင်း
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # v4 သို့ မြှင့်ထားပါသည်

      - name: Inject Secrets into Code
        run: |
          sed -i 's/__YOUTUBE_API_KEY__/${{ secrets.YOUTUBE_API_KEY }}/g' index.html
          sed -i 's/__GEMINI_API_KEY__/${{ secrets.GEMINI_API_KEY }}/g' index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
