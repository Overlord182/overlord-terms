name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # မိမိ main branch နာမည်ဖြစ်ရမည် (master ဆိုပါက master ဟုပြင်ပါ)

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Secrets into Code
        run: |
          Y_KEY=$(echo -n "${{ secrets.YOUTUBE_API_KEY }}" | base64 -w 0)
          G_KEY=$(echo -n "${{ secrets.GEMINI_API_KEY }}" | base64 -w 0)
          
          sed -i "s/__YOUTUBE_API_KEY__/$(echo $Y_KEY | base64 -d)/g" *.html
          sed -i "s/__GEMINI_API_KEY__/$(echo $G_KEY | base64 -d)/g" *.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
