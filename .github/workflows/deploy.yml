name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main  # မိမိ main branch နာမည်ဖြစ်ရမည်
    paths:
      - 'user_guide_youtube.html' # user_guide_youtube.html ဖိုင် ပြောင်းလဲမှသာ ဒီ workflow အလုပ်လုပ်မည်
      - '**.html'                # သို့မဟုတ် HTML ဖိုင်များ ပြောင်းလဲပါက အလုပ်လုပ်မည်

# GitHub Pages သို့ deploy လုပ်ရန် ခွင့်ပြုချက် (Permissions) ပေးခြင်း
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Secrets into Code
        run: |
          sed -i "s/__YOUTUBE_API_KEY__/${{ secrets.YOUTUBE_API_KEY }}/g" *.html
          sed -i "s/__GEMINI_API_KEY__/${{ secrets.GEMINI_API_KEY }}/g" *.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Repository ရဲ့ root folder (user_guide_youtube.html ရှိသည့်နေရာ) ကို upload တင်မည်
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
